name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so registry updates reach the site without a code push.
  schedule:
    - cron: "30 19 * * *" # 05:30 AEST

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pull the newest registry index and merge it into the committed one,
      # keeping the site's own descriptions, tiers and categories. The merged
      # file only lives in this build; the repo keeps the enriched baseline so
      # it does not gain an 80 MB commit every day.
      #
      # On main this step is FATAL. It used to warn and carry on, which meant a
      # dead REGISTRY_TOKEN shipped a silently stale catalogue: the site served
      # 26,001 skills against a registry of 44,854 for weeks while every build
      # reported success. A publish that quietly drops 42% of the catalogue is
      # worse than no publish, so the deploy stops instead. Off main the same
      # failure is only a warning, so branch build tests still work without the
      # secret.
      - name: Sync skills index from registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -uo pipefail

          fail() {
            if [ "$IS_MAIN" = "true" ]; then
              echo "::error::$1"
              echo "Refusing to deploy a stale catalogue. See the step log above." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning::$1 (not main - continuing with the committed index)"
            exit 0
          }

          [ -n "$REGISTRY_TOKEN" ] || fail "REGISTRY_TOKEN is not set."

          curl -fsSL --retry 3 --max-time 300 \
            -H "Authorization: Bearer $REGISTRY_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            -o /tmp/registry-index.json \
            "https://api.github.com/repos/growsontrees/trustedskills-registry/contents/skills-index.json" \
            || fail "Could not download the registry index. REGISTRY_TOKEN is most likely expired or lacks Contents:Read on growsontrees/trustedskills-registry."

          node scripts/sync-index.mjs /tmp/registry-index.json \
            || fail "Registry merge refused - see the reason above."

          # Record what actually shipped, so drift is visible on the run itself
          # rather than only by diffing the live site against the registry.
          node -e '
            const { skills, stats } = require("./data/skills-index.json");
            console.log(`Index now carries ${skills.length} skills.`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Registry sync\n\n- **${skills.length}** skills\n- **${stats.total_authors}** authors\n- registry generated \`${stats.last_updated}\`\n`);
          '

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Runs on other branches (manual dispatch) are a build test only:
          # nothing is pushed and nothing is deployed.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Coolify pulls :latest and restarts the container. Without this the VPS
      # would sit on the previous image until someone redeployed by hand.
      - name: Trigger Coolify deploy
        id: deploy
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK not set - image pushed, skipping deploy trigger."
            exit 0
          fi
          # Reaching the VPS from a hosted runner is occasionally flaky, and the
          # image is already published by this point - retry rather than leave
          # the server sitting on the previous image.
          RESP=""
          for attempt in 1 2 3 4 5; do
            if RESP=$(curl -fsSL --connect-timeout 20 --max-time 60 \
                        -X GET "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"); then
              echo "triggered on attempt $attempt"
              break
            fi
            echo "attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
            RESP=""
          done

          if [ -z "$RESP" ]; then
            echo "Could not reach Coolify after 5 attempts. Image is pushed;"
            echo "redeploy from the Coolify dashboard to pick it up."
            exit 1
          fi

          echo "$RESP"
          UUID=$(echo "$RESP" | jq -r '.deployments[0].deployment_uuid // empty')
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"

      # Purging before the new container is live would just re-cache the old
      # pages, so wait for the deployment to settle first.
      - name: Wait for deployment
        if: steps.deploy.outputs.uuid != ''
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ steps.deploy.outputs.uuid }}
        run: |
          BASE=$(echo "${{ secrets.COOLIFY_WEBHOOK }}" | sed 's#/deploy?.*##')
          for i in $(seq 1 60); do
            S=$(curl -s -H "Authorization: Bearer $COOLIFY_TOKEN" "$BASE/deployments/$UUID" | jq -r '.status // "?"')
            echo "  [$i] $S"
            case "$S" in
              finished) exit 0 ;;
              failed|cancelled) echo "Deployment $S"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for deployment"; exit 1

      # Static assets under /public (sitemaps, llms.txt, robots.txt) are cached
      # at the edge, so a deploy that changes them is invisible without this.
      - name: Purge Cloudflare cache
        if: success() && steps.deploy.outputs.uuid != ''
        env:
          ZONE: ${{ secrets.CF_ZONE_ID }}
          EMAIL: ${{ secrets.CF_EMAIL }}
          GLOBAL_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "$ZONE" ]; then echo "CF_ZONE_ID not set - skipping purge."; exit 0; fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
            -H "X-Auth-Email: $EMAIL" -H "X-Auth-Key: $GLOBAL_KEY" \
            -H "Content-Type: application/json" --data '{"purge_everything":true}' \
            | jq -r 'if .success then "cache purged" else "purge failed: \(.errors)" end'
